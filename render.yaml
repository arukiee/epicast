services:
  - type: web
    name: epicast-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: EPICAST_ENV
        value: production
      - key: EPICAST_SECRET_KEY
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "True"
      - key: SMTP_SSL
        value: "False"
      - key: EMAIL_ALLOW_CONSOLE_FALLBACK
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./epicast.db
